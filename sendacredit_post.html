<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendacredit Group – Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    font-family: 'Inter', sans-serif;
  }

  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #060e28;
    flex-shrink: 0;
  }

  /* ── Fondo navy degradado ── */
  .bg-navy {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #0a1a4a 0%, #060e28 55%);
  }

  /* ── Blob teal inferior ── */
  .bg-teal-blob {
    position: absolute;
    bottom: -120px;
    left: -80px;
    width: 900px;
    height: 700px;
    background: radial-gradient(ellipse at 40% 60%, #00c8d0 0%, #0097a7 50%, transparent 75%);
    opacity: 0.18;
    border-radius: 50%;
    filter: blur(40px);
  }
  .bg-teal-blob2 {
    position: absolute;
    bottom: -60px;
    right: -100px;
    width: 700px;
    height: 600px;
    background: radial-gradient(ellipse, #00bcd4 0%, transparent 70%);
    opacity: 0.12;
    border-radius: 50%;
    filter: blur(60px);
  }

  /* ── Ondas decorativas ── */
  .waves-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0.06;
  }

  /* ── Franja teal inferior ── */
  .teal-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 360px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,188,196,0.08) 30%, rgba(0,168,176,0.15) 100%);
  }

  /* ── Línea divisoria ── */
  .divider-line {
    position: absolute;
    bottom: 355px;
    left: 80px; right: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,200,210,0.4) 30%, rgba(0,200,210,0.4) 70%, transparent);
  }

  /* ── Contenido ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 80px 52px;
  }

  /* Label top */
  .top-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 195, 210, 0.12);
    border: 1px solid rgba(0, 195, 210, 0.3);
    border-radius: 100px;
    padding: 8px 24px;
    color: #00c8d4;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 52px;
  }
  .top-label span { font-size: 18px; }

  /* Titular */
  .headline {
    text-align: center;
    line-height: 1.05;
    margin-bottom: 24px;
  }
  .headline .line1 {
    display: block;
    font-size: 96px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -3px;
  }
  .headline .line2 {
    display: block;
    font-size: 96px;
    font-weight: 900;
    background: linear-gradient(90deg, #00c8d4, #00e5f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -3px;
  }

  /* Subtítulo */
  .subtitle {
    font-size: 26px;
    font-weight: 300;
    color: rgba(180, 215, 255, 0.85);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 44px;
    max-width: 740px;
  }

  /* Logo */
  .logo-wrap {
    margin-bottom: 40px;
  }
  .logo-wrap img {
    width: 148px;
    height: 148px;
    object-fit: contain;
    filter: drop-shadow(0 0 32px rgba(0,200,220,0.35));
  }

  /* Pills beneficios */
  .pills {
    display: flex;
    gap: 16px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pill {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    padding: 10px 26px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.3px;
  }
  .pill .dot { color: #00c8d4; margin-right: 6px; }

  /* CTA */
  .cta-btn {
    background: linear-gradient(135deg, #00c8d4 0%, #00a8b4 100%);
    color: #060e28;
    font-size: 28px;
    font-weight: 700;
    padding: 20px 58px;
    border-radius: 100px;
    margin-bottom: 26px;
    letter-spacing: 0.2px;
    box-shadow: 0 8px 40px rgba(0,200,220,0.35);
  }

  /* Web + hashtags */
  .web {
    font-size: 22px;
    font-weight: 600;
    color: rgba(200, 230, 240, 0.6);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .hashtags {
    font-size: 17px;
    color: rgba(150, 195, 215, 0.45);
    letter-spacing: 0.3px;
  }
</style>
</head>
